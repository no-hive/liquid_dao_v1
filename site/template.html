<!doctype html>

<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">
  <title>Liquid DAO — Whitepaper</title>
  <script>
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>

</head>

  <div id="menu-backdrop" class="menu-backdrop" aria-hidden="true"></div>
  <nav id="menu-panel" class="menu-panel" aria-label="Whitepaper contents" aria-hidden="true" inert>
